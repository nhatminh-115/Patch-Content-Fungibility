name: One-shot migrate fungibility figures

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-fungibility-binaries.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy fungibility figure assets from source repo
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/nhatminh-115/ResCancel.git /tmp/source

          mkdir -p figures
          rm -rf figures/fungibility_* figures/paper_final

          cp -a /tmp/source/figures/fungibility_* figures/
          cp -a /tmp/source/figures/paper_final figures/

      - name: Verify figure bytes against source
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' src; do
            rel="${src#/tmp/source/}"
            test -f "$rel"
            source_sha="$(git hash-object "$src")"
            dest_sha="$(git hash-object "$rel")"
            test "$source_sha" = "$dest_sha" || {
              echo "SHA mismatch: $rel"
              exit 1
            }
            count=$((count + 1))
          done < <(
            find /tmp/source/figures -type f \( -path '/tmp/source/figures/fungibility_*/*' -o -path '/tmp/source/figures/paper_final/*' \) -print0
          )
          echo "Verified $count figure assets."

      - name: Commit migrated figures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f figures/fungibility_* figures/paper_final

          if git diff --cached --quiet; then
            echo "No figure changes to commit."
            exit 0
          fi

          git commit -m "Migrate Patch Content Fungibility figure assets"
          git push origin HEAD:main
