name: One-shot repair large migrated text artifacts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-large-migrated-artifacts.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4

      - name: Copy exact source files
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/nhatminh-115/ResCancel.git /tmp/source

          cp /tmp/source/outputs/fungibility_dense_fraction/summary_by_mask_seed.csv              outputs/fungibility_dense_fraction/summary_by_mask_seed.csv

          cp /tmp/source/outputs/fungibility_v0_5/experiment_manifest.json              outputs/fungibility_v0_5/experiment_manifest.json

      - name: Verify blob SHAs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object outputs/fungibility_dense_fraction/summary_by_mask_seed.csv)" = "f4661fbd42bf2d56fd0a9cd351397f181d2605fb"
          test "$(git hash-object outputs/fungibility_v0_5/experiment_manifest.json)" = "1d0a8f4a725fcbd9d301d43295f71bf4c16afa13"

      - name: Commit repaired artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f             outputs/fungibility_dense_fraction/summary_by_mask_seed.csv             outputs/fungibility_v0_5/experiment_manifest.json
          git commit -m "Repair large migrated text artifacts"
          git push origin HEAD:main
